  return [['Hersteller', it.brand], ['Modell', it.model]];
}

async function makeItemPdf(it) {
  const { jsPDF } = await loadJsPdf();
  const doc = new jsPDF({ unit: 'mm', format: 'a4', compress: true });
  const book = it.category === 'buch';
  const pt = n => n * 0.3528;
  doc.setProperties({ title: pdfText(it.title || 'Eintrag'), author: 'Kalbacher Kobel', creator: 'Kalbacher Kobel Inventar' });

  const [header, footer, cover] = await Promise.all([
    svgToPng(pdfHeaderSvg(), 210, 64),
    svgToPng(pdfFooterSvg(), 210, 36),
    pdfCover(it, 56, book ? 80 : 56),
  ]);

  // Kopf mit Logo
  doc.addImage(header, 'PNG', 0, 0, 210, 64);
  try { doc.addImage(LOGO_LIGHT, 'PNG', 16, 17, 74, 74 * 133 / 516); } catch { /* ohne Logo */ }

  // Cover oder gezeichneter Platzhalter
  const cx = 16, cy = 72, cw = 56, ch = book ? 80 : 56;
  doc.setFillColor(PDF_C.line); doc.roundedRect(cx + 1.6, cy + 2, cw, ch, 3, 3, 'F');
  if (cover) doc.addImage(cover, 'JPEG', cx, cy, cw, ch);
  else {
    doc.setFillColor(PDF_C.green); doc.roundedRect(cx, cy, cw, ch, 3, 3, 'F');
    doc.setFillColor(PDF_C.lime); doc.rect(cx + 6, cy, 3, ch, 'F');
    doc.setFillColor(PDF_C.orange); doc.roundedRect(cx + 16, cy + ch - 16, cw - 26, 2.4, 1.2, 1.2, 'F');
    doc.setFont('helvetica', 'bold'); doc.setFontSize(54); doc.setTextColor('#FFFFFF');
    doc.text(pdfText((it.title || '?').trim().charAt(0).toUpperCase()) || '?', cx + cw / 2 + 2, cy + ch / 2 + pt(54) * 0.35, { align: 'center' });
  }

  // Rechte Spalte
  const X = 82, W = 112;
  let y = 76;
  doc.setFont('helvetica', 'bold'); doc.setFontSize(8.5); doc.setTextColor(PDF_C.olive);
  doc.setCharSpace(0.6);
  doc.text(pdfText(book ? 'AUS DEM BÜCHERREGAL' : (CATS[it.category]?.one || 'Inventar').toUpperCase()), X, y);
  doc.setCharSpace(0);

  let size = 24, lines;
  doc.setTextColor(PDF_C.green);
  for (;;) {
    doc.setFontSize(size);
    lines = doc.splitTextToSize(pdfText(it.title || 'Ohne Titel'), W);
    if (lines.length <= 3 || size <= 15) break;
    size -= 2;
  }
  if (lines.length > 3) { lines = lines.slice(0, 3); lines[2] = lines[2].replace(/\s*\S*$/, '') + ' …'; }
  y += 4 + pt(size);
  lines.forEach((l, i) => doc.text(l, X, y + i * pt(size) * 1.12));
  y += (lines.length - 1) * pt(size) * 1.12;

  if (book && it.author) {
    doc.setFont('helvetica', 'normal'); doc.setFontSize(12.5); doc.setTextColor(PDF_C.muted);
    const al = doc.splitTextToSize(pdfText(it.author), W).slice(0, 2);
    y += 7;
    al.forEach((l, i) => doc.text(l, X, y + i * pt(12.5) * 1.2));
    y += (al.length - 1) * pt(12.5) * 1.2;
  }

  // Aufkleber-Nummer und Status
  y += 7;
  let px = X;
  const pill = (label, fill, color) => {
    doc.setFont('helvetica', 'bold'); doc.setFontSize(9);
    const w = doc.getTextWidth(label) + 8;
    doc.setFillColor(fill); doc.roundedRect(px, y, w, 7.4, 3.7, 3.7, 'F');
    doc.setTextColor(color); doc.text(label, px + 4, y + 5);
    px += w + 3;
  };
  if (it.number !== null && it.number !== undefined && it.number !== '') pill(`Nr. ${fmtNum(it.number)}`, PDF_C.sticker, '#2A2410');
  if (it.loan) pill('Zurzeit ausgeliehen', PDF_C.peach, '#9A4A0C');
  else pill('Verfügbar', PDF_C.limeSoft, '#3E4A0E');
  y += 7.4 + 8;

  // Steckbrief-Daten
  const facts = pdfFacts(it).map(([k, v]) => [k, pdfText(v)]).filter(f => f[1]);
  facts.forEach(([k, v], i) => {
    if (i) { doc.setDrawColor(PDF_C.line); doc.setLineWidth(0.3); doc.line(X, y - 4.6, X + W, y - 4.6); }
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(PDF_C.muted);
    doc.text(k, X, y);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(10.5); doc.setTextColor(PDF_C.ink);
    let val = v;
    while (doc.getTextWidth(val) > W - 30 && val.length > 4) val = val.slice(0, -2);
    if (val !== v) val = val.trimEnd() + '…';
    doc.text(val, X + 30, y);
    y += 9;
  });

  // Inhalt
  let ty = Math.max(cy + ch + 2, y - 2) + 12;
  const bottom = 252;
  const desc = pdfText(it.description).replace(/\s*\n\s*/g, '\n');
  if (desc) {
    doc.setFont('helvetica', 'bold'); doc.setFontSize(14); doc.setTextColor(PDF_C.green);
    doc.text(book ? 'Worum geht’s?' : 'Beschreibung', 16, ty);
    doc.setFillColor(PDF_C.lime); doc.roundedRect(16, ty + 2.4, 14, 1.6, 0.8, 0.8, 'F');
    ty += 11;
    doc.setFont('helvetica', 'normal'); doc.setFontSize(11); doc.setTextColor(PDF_C.ink);
    const lh = pt(11) * 1.5;
    let dl = doc.splitTextToSize(desc, 178);
    const room = Math.max(1, Math.floor((bottom - 16 - ty) / lh) + 1);
    if (dl.length > room) { dl = dl.slice(0, room); dl[room - 1] = dl[room - 1].replace(/\s*\S*$/, '') + ' …'; }
    dl.forEach((l, i) => doc.text(l, 16, ty + i * lh));
    ty += (dl.length - 1) * lh + 10;
  }

  // Hinweis-Kasten
  if (ty + 14 <= bottom + 6) {
    const msg = it.loan
      ? 'Gerade ausgeliehen – sprich mich gern an, dann melde ich mich, sobald es zurück ist.'
      : `Interesse an ${book ? 'diesem Buch' : it.category === 'spiel' ? 'diesem Spiel' : 'diesem Eintrag'}? Sprich mich einfach an.`;
    const by = Math.max(ty, desc ? ty : bottom - 6);
    doc.setFillColor(PDF_C.soft); doc.roundedRect(16, by, 178, 13, 4, 4, 'F');
    doc.setFillColor(PDF_C.turq); doc.circle(24, by + 6.5, 2.2, 'F');
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(PDF_C.green);
    doc.text(msg, 30, by + 7.9);
  }

  // Fuß mit Hügeln
  doc.addImage(footer, 'PNG', 0, 261, 210, 36);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(8.5); doc.setTextColor('#FFFFFF');
  doc.text('Kalbacher Kobel', 16, 291);
  const w1 = doc.getTextWidth('Kalbacher Kobel');
  doc.setFont('helvetica', 'normal');
  doc.text('  ·  Samira Kraus  ·  Kindertagespflege', 16 + w1, 291);
  doc.text(`Stand: ${fmtDate(Date.now())}`, 194, 291, { align: 'right' });

  return doc.output('blob');
}

async function deliverPdf(blob, name) {
  if (window.PREVIEW) {
    const dl = window.claude ? await window.claude.use('downloads') : null;
    if (!dl) { toast('In der Vorschau lässt sich die PDF nicht speichern. In deiner eigenen App klappt es.'); return; }
    try { await dl.save({ filename: name, data: blob }); }
    catch (e) { if (!e || e.code !== 'declined') toast('Die PDF konnte nicht gespeichert werden.'); }
    return;
  }
  try {
    const file = new File([blob], name, { type: 'application/pdf' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return; }
  } catch (err) { if (err && err.name === 'AbortError') return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
}

async function exportItemPdf(it, btn) {
  if (btn) { btn.disabled = true; btn.dataset.label = btn.innerHTML; btn.innerHTML = 'PDF wird erstellt …'; }
  try {
    const blob = await makeItemPdf(it);
    const base = String(it.title || 'Eintrag').replace(/[\\/:*?"<>|]+/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 80) || 'Eintrag';
    await deliverPdf(blob, `${base} – Kalbacher Kobel.pdf`);
  } catch (e) {
    console.error(e);
    toast(navigator.onLine ? 'Die PDF konnte nicht erstellt werden.' : 'Für die PDF brauchst du einmal Internet.');
  } finally {
    if (btn) { btn.disabled = false; btn.innerHTML = btn.dataset.label; }
  }
}

/* ---------- Ansicht: Einstellungen ---------- */
async function shareOrDownload(name, text, type) {
  const blob = new Blob([text], { type });
  try {
    const file = new File([blob], name, { type });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: name });
      return;
    }
  } catch (err) { if (err && err.name === 'AbortError') return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}

function toCsv() {
  const cols = [['Nummer', it => fmtNum(it.number)], ['Kategorie', it => CATS[it.category]?.one || ''], ['Titel', it => it.title],
    ['Autor', it => it.author], ['Jahr', it => it.year], ['Verlag', it => it.publisher], ['ISBN', it => it.isbn],
    ['Hersteller', it => it.brand], ['Modell', it => it.model], ['Seriennummer', it => it.serial],
    ['Kaufdatum', it => it.purchaseDate], ['Kaufpreis', it => it.price], ['Spieler', it => it.players], ['Alter ab', it => it.age], ['Notizen', it => it.notes],
    ['Ausgeliehen an', it => it.loan ? it.loan.name : ''], ['Ausgeliehen seit', it => it.loan ? fmtDate(it.loan.since) : '']];
  const cell = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const sorted = [...items].sort((a, b) => (a.number ?? 1e9) - (b.number ?? 1e9));
  return '\uFEFF' + [cols.map(c => cell(c[0])).join(';'), ...sorted.map(it => cols.map(c => cell(c[1](it))).join(';'))].join('\r\n');
}

      <div class="field"><label for="srv-url">Serveradresse</label><input id="srv-url" type="url" inputmode="url" autocapitalize="off" autocorrect="off" placeholder="https://…" value="${esc(Sync.url || '')}"></div>
      <div class="field"><label for="srv-mail">E-Mail</label><input id="srv-mail" type="email" autocomplete="username" autocapitalize="off"></div>
      <div class="field"><label for="srv-pw">Passwort</label><input id="srv-pw" type="password" autocomplete="current-password"></div>
      <div class="status" id="srv-status"></div>
      <button class="btn primary" id="srv-go">Verbinden</button>`;
    $('#srv-go').addEventListener('click', async () => {
      const url = $('#srv-url').value.trim(), mail = $('#srv-mail').value.trim(), pw = $('#srv-pw').value;
      const st = $('#srv-status');
      if (!/^https:\/\//.test(url) && !/^http:\/\/(localhost|127\.)/.test(url)) { st.className = 'status err'; st.textContent = 'Die Adresse muss mit https:// beginnen.'; return; }
      if (!mail || !pw) { st.className = 'status err'; st.textContent = 'Gib E-Mail und Passwort ein.'; return; }
      st.className = 'status'; st.textContent = 'Verbinde …';
      $('#srv-go').disabled = true;
      try {
        await Sync.login(url, mail, pw);
        toast('Verbunden. Ihr nutzt jetzt denselben Bestand.');
        renderSettings();
      } catch (e) {
        st.className = 'status err';
        st.textContent = e && e.status === 400 ? 'E-Mail oder Passwort stimmt nicht.'
          : 'Der Server ist nicht erreichbar. Prüf die Adresse und deine Internetverbindung.';
        const b = $('#srv-go'); if (b) b.disabled = false;
      }
    });
    return;
  }
  const t = Sync.lastSync ? Sync.lastSync.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) : '';
  box.innerHTML = `
    <h2>Gemeinsamer Speicher</h2>
    <p>Angemeldet als ${esc(Sync.user)} bei ${esc(Sync.url)}.<br>${esc(syncLabel())}${t && Sync.state === 'ok' ? `, zuletzt um ${t}` : ''}.</p>
    <button class="btn" id="srv-sync">Jetzt abgleichen</button>
    <button class="btn" id="srv-out">Abmelden</button>`;
  $('#srv-sync').addEventListener('click', () => Sync.sync());
  $('#srv-out').addEventListener('click', async () => {
    if (Sync.pending && !await askConfirm(`${Sync.pending} Änderungen sind noch nicht auf dem Server. Trotzdem abmelden?`, 'Abmelden', true)) return;
    await Sync.logout();
    toast('Abgemeldet. Die Daten bleiben auf diesem Gerät.');
    renderSettings();
  });
}

$('#import-input').addEventListener('change', async e => {
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    const list = Array.isArray(data) ? data : data.items;
    if (!Array.isArray(list)) throw new Error('format');
    const valid = list.filter(x => x && typeof x === 'object' && x.id).map(x => validId(x.id) ? x : { ...x, id: uid() });
    if (!await askConfirm(`${valid.length} Einträge einspielen? Gleiche Einträge werden überschrieben.`, 'Einspielen')) return;
    await DB.putMany(valid);
    for (const it of valid) { items = items.filter(x => x.id !== it.id); items.push(it); await Sync.queue('put', it.id); }
    if (data.settings && data.settings.digits) { settings = { ...settings, ...data.settings }; await DB.setMeta('settings', settings); }
    items = await DB.all();
    toast(`${valid.length} Einträge eingespielt.`);
    location.hash = '#/';
  } catch {
    toast('Diese Datei ist keine Inventar-Sicherung.');
  }
});

/* ---------- Navigation ---------- */
function route() {
  if (currentView === 'list') listState.scroll = window.scrollY;
  closeScanner();
  const h = location.hash.slice(1) || '/';
  const [path, qs] = h.split('?');
  const params = new URLSearchParams(qs || '');
  const parts = path.split('/').filter(Boolean);
  if (parts[0] !== 'new' && parts[0] !== 'edit') draft = null;
  if (!parts.length) {
    if (listState.ai && (listState.ai.error || listState.ai.loading)) listState.ai = null;
    currentView = 'list'; renderList(); return;
  }
  currentView = parts[0];
  window.scrollTo(0, 0);
  if (parts[0] === 'item') renderDetail(parts[1]);
  else if (parts[0] === 'edit') renderForm(parts[1], params);
  else if (parts[0] === 'new') renderForm(null, params);
  else if (parts[0] === 'settings') renderSettings();
  else { currentView = 'list'; renderList(); }
}

window.addEventListener('hashchange', route);

(async function start() {
  try {
    items = await DB.all();
    const s = await DB.getMeta('settings');
    if (s) settings = { ...settings, ...s };
    const savedAi = await DB.getMeta('ai');
    if (savedAi) ai = { provider: savedAi.provider || 'openai', keys: savedAi.keys || {} };
  } catch {
    $('#view').innerHTML = '<div class="empty"><h2>Speicher nicht verfügbar</h2><p>Öffne die App nicht im privaten Modus des Browsers.</p></div>';
    return;
  }
  if (window.PREVIEW && !items.length && !(await DB.getMeta('demo'))) {
    const day = 86400000, now = Date.now();
    const d = (n, t, a, y, v, txt) => ({ id: uid(), category: 'buch', number: n, title: t, author: a, year: y, publisher: v, description: txt, createdAt: now - n * 1000 });
    const demo = [
      d(1, 'Momo', 'Michael Ende', '1973', 'Thienemann', 'Das kleine Mädchen Momo lebt in einem alten Amphitheater und kann wunderbar zuhören. Als die grauen Herren den Menschen ihre Zeit stehlen, stellt sie sich ihnen entgegen.'),
      d(2, 'Der Name der Rose', 'Umberto Eco', '1980', 'Hanser', 'In einer Abtei im Jahr 1327 geschehen rätselhafte Todesfälle. Der Franziskaner William von Baskerville soll sie aufklären.'),
      d(3, 'Die Blechtrommel', 'Günter Grass', '1959', 'Luchterhand', 'Oskar Matzerath beschließt mit drei Jahren, nicht mehr zu wachsen, und erzählt trommelnd vom Danzig der Vorkriegs- und Kriegszeit.'),
      d(4, 'Der Vorleser', 'Bernhard Schlink', '1995', 'Diogenes', 'Der fünfzehnjährige Michael verliebt sich in die ältere Hanna. Jahre später sieht er sie als Angeklagte vor Gericht wieder.'),
      { id: uid(), category: 'werkzeug', number: 5, title: 'Akkuschrauber', brand: 'Bosch', model: 'GSR 12V-15', serial: 'B-4471-22', createdAt: now - 5000 },
      { id: uid(), category: 'spiel', number: 7, title: 'Die Siedler von Catan', publisher: 'Kosmos', players: '3–4', age: '10', duration: '75', createdAt: now - 7000 },
      { id: uid(), category: 'edv', number: 6, title: 'Externe Festplatte 2 TB', brand: 'WD', model: 'My Passport', createdAt: now - 6000 },
    ];
    demo[1].loan = { name: 'Anna', since: now - 12 * day };
    demo[1].loans = [{ name: 'Thomas', from: now - 120 * day, to: now - 95 * day }];
    demo[0].loans = [{ name: 'Anna', from: now - 60 * day, to: now - 41 * day }, { name: 'Oma Gisela', from: now - 200 * day, to: now - 150 * day }];
    demo[4].loan = { name: 'Nachbar Jens', since: now - 3 * day };
    await DB.putMany(demo); await DB.setMeta('demo', true); items = await DB.all();
  }
  route();
  Sync.init();

})();

</script>
