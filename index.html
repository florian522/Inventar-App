<style>
:root {
  color-scheme: light;
  --paper: #F6F8EC;
  --surface: #FFFFFF;
  --ink: #1B2B2E;
  --muted: #5A6B66;
  --line: #DDE3CC;
  --green: #19555F;
  --green-ink: #FFFFFF;
  --green-soft: #DDEEEF;
  --lime: #C5D62E;
  --lime-ink: #19414A;
  --olive: #6E7D1B;
  --sticker: #F4D35E;
  --sticker-ink: #2A2410;
  --danger: #A23B2C;
  --loan: #FCE9D4;
  --loan-line: #F2C595;
  --loan-ink: #9A4A0C;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --round: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", system-ui, sans-serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --bar-h: 76px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #0F1918;
    --surface: #162423;
    --ink: #E6EDE4;
    --muted: #97A89F;
    --line: #273836;
    --green: #7BC4CB;
    --green-ink: #0B1A1A;
    --green-soft: #1A3536;
    --lime: #C5D62E;
    --lime-ink: #15301A;
    --olive: #C9D86A;
    --sticker: #E9C84F;
    --sticker-ink: #221D08;
    --danger: #E07A68;
    --loan: #3A2818;
    --loan-line: #6B4422;
    --loan-ink: #F2A864;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #0F1918;
  --surface: #162423;
  --ink: #E6EDE4;
  --muted: #97A89F;
  --line: #273836;
  --green: #7BC4CB;
  --green-ink: #0B1A1A;
  --green-soft: #1A3536;
  --lime: #C5D62E;
  --lime-ink: #15301A;
  --olive: #C9D86A;
  --sticker: #E9C84F;
  --sticker-ink: #221D08;
  --danger: #E07A68;
  --loan: #3A2818;
  --loan-line: #6B4422;
  --loan-ink: #F2A864;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 16px/1.45 var(--sans);
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  -webkit-tap-highlight-color: transparent;
}
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--green); outline-offset: 2px; }

#view { max-width: 720px; margin: 0 auto; padding: 0 16px calc(var(--bar-h) + 24px + env(safe-area-inset-bottom, 0px)); }

/* Kopf */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 0 10px; }
.top { align-items: flex-start; padding-top: 14px; }
.brand { min-width: 0; }
.brand picture, .brand img { display: block; width: min(250px, 68vw); height: auto; }
.brand-row { display: flex; align-items: baseline; gap: 12px; margin-top: 10px; flex-wrap: wrap; }
.top h1 { font: 700 24px/1.1 var(--round); color: var(--olive); margin: 0; }
.top .count { color: var(--muted); font-size: 14px; display: flex; flex-wrap: wrap; gap: 0 10px; }
.sync::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); margin-right: 5px; vertical-align: 1px; }
.sync[data-state="ok"]::before { background: var(--green); }
.sync[data-state="offline"]::before, .sync[data-state="error"]::before, .sync[data-state="login"]::before, .sync[data-state="rules"]::before { background: var(--danger); }
.iconbtn { border: 0; background: transparent; padding: 10px; border-radius: 12px; display: inline-flex; color: var(--ink); cursor: pointer; text-decoration: none; }
.iconbtn:active { background: var(--green-soft); }
.iconbtn svg { width: 24px; height: 24px; }

.back { display: inline-flex; align-items: center; gap: 4px; padding: 16px 0 8px; color: var(--green); text-decoration: none; font-weight: 600; }
.back svg { width: 20px; height: 20px; }

/* Suche + Filter */
.search { position: relative; margin: 4px 0 10px; }
.search input { width: 100%; padding: 12px 14px 12px 42px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; color: var(--muted); }
.filters { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: none; align-items: center; }
.filters::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); padding: 7px 13px; border-radius: 999px; font-size: 14px; cursor: pointer; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--lime); color: var(--lime-ink); border-color: var(--lime); font-weight: 600; }
.chip small { opacity: .7; margin-left: 3px; }
.filter-row { display: flex; align-items: center; gap: 6px; }
.filter-row .filters { flex: 1; min-width: 0; }
.sort { flex: none; border: 0; background: transparent; color: var(--muted); font-size: 14px; padding: 7px 4px; }

/* Liste */
.list { margin-top: 6px; border-top: 1px solid var(--line); }
.row { display: grid; grid-template-columns: 46px 1fr auto; gap: 14px; align-items: center; padding: 12px 8px; border-bottom: 1px solid var(--line); text-decoration: none; }
.row:active { background: var(--green-soft); }
.thumb { width: 46px; height: 66px; border-radius: 3px 5px 5px 3px; overflow: hidden; background: var(--green-soft); display: grid; place-items: center; color: var(--green); font: 600 18px var(--serif); box-shadow: inset 3px 0 0 rgba(0,0,0,.08); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb.square { height: 46px; border-radius: 8px; box-shadow: none; }
.row-title { font: 600 17px/1.25 var(--serif); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.row-sub { color: var(--muted); font-size: 14px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row > div { min-width: 0; }
.row.lent { background: var(--loan); }
.row-loan { color: var(--loan-ink); font-size: 14px; font-weight: 600; margin-top: 2px; }
.chip.loan { background: var(--loan); border-color: var(--loan-line); color: var(--loan-ink); }
.chip.loan[aria-pressed="true"] { background: var(--loan-ink); border-color: var(--loan-ink); color: var(--surface); }

/* Ausleihe */
.loan-box { margin: 22px 0 0; padding: 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
.loan-box label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 6px; }
.loan-box input { flex: 1; min-width: 0; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); }
.loan-box.out { background: var(--loan); border-color: var(--loan-line); }
.loan-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.loan-title { font-weight: 700; color: var(--loan-ink); }
.loan-sub { font-size: 14px; color: var(--loan-ink); opacity: .85; margin-top: 2px; }
.loan-label { display: flex; align-items: center; justify-content: space-between; margin: -6px 0 2px; }
.loan-label label { margin: 0; }
.loan-btns { display: flex; align-items: center; gap: 4px; flex: none; }
.hist-btn { position: relative; color: var(--muted); }
.loan-box.out .hist-btn { color: var(--loan-ink); }
.hist-btn[aria-expanded="true"] { background: var(--green-soft); color: var(--green); }
.loan-box.out .hist-btn[aria-expanded="true"] { background: rgba(255,255,255,.45); color: var(--loan-ink); }
.hist-count { position: absolute; top: 3px; right: 2px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--loan-ink); color: var(--surface); font-size: 11px; font-weight: 700; line-height: 17px; text-align: center; }
.history-box { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); }
.loan-box.out .history-box { border-top-color: var(--loan-line); }
.history-title { font-weight: 600; margin-bottom: 2px; }
.history-empty { color: var(--muted); margin: 6px 0 0; font-size: 15px; }
.history li.now span:first-child { font-weight: 600; color: var(--loan-ink); }
.loan-box.out .history li { border-bottom-color: var(--loan-line); }
.history li:last-child { border-bottom: 0; }
.history { list-style: none; padding: 0; margin: 0; }
.history li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.history li span:last-child { color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }

/* Inventaraufkleber */
.tag { font: 700 14px/1 var(--sans); font-variant-numeric: tabular-nums; letter-spacing: .04em; background: #D3D7DB; color: #2E353B; padding: 7px 8px; border-radius: 4px; position: relative; }
.tag::before { content: ""; position: absolute; inset: 2px; border: 1px solid rgba(60,70,80,.18); border-radius: 2px; pointer-events: none; }
.tag.none { background: transparent; box-shadow: none; text-shadow: none; color: var(--muted); font-weight: 500; letter-spacing: 0; font-size: 13px; }
.tag.none::before { border-color: var(--line); border-style: solid; }
.tag.big { font-size: 22px; padding: 11px 13px; }

.empty { text-align: center; padding: 48px 12px; color: var(--muted); }
.empty h2 { font: 700 22px var(--round); color: var(--ink); margin: 0 0 8px; }

/* Untere Leiste */
.bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); background: color-mix(in srgb, var(--paper) 88%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--line); z-index: 5; }
.bar-inner { max-width: 720px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); padding: 13px 16px; border-radius: 12px; font-weight: 600; cursor: pointer; text-decoration: none; min-height: 50px; }
.btn svg { width: 20px; height: 20px; flex: none; }
.btn.primary { background: var(--green); color: var(--green-ink); border-color: var(--green); }
.btn.lime { background: var(--lime); color: var(--lime-ink); border-color: var(--lime); }
.btn.danger { color: var(--danger); }
.btn.small { min-height: 0; padding: 10px 12px; font-size: 15px; }
.btn:disabled { opacity: .5; }
.btn:active { transform: scale(.98); }

/* Detail */
.detail-head { display: grid; grid-template-columns: 120px 1fr; gap: 18px; align-items: start; margin-top: 8px; }
.cover-lg { width: 120px; aspect-ratio: 2/3; border-radius: 3px 6px 6px 3px; overflow: hidden; background: var(--green-soft); display: grid; place-items: center; color: var(--green); font: 600 40px var(--serif); box-shadow: 0 6px 18px rgba(0,0,0,.18), inset 4px 0 0 rgba(0,0,0,.08); }
.cover-lg.square { aspect-ratio: 1; border-radius: 12px; }
.cover-lg img { width: 100%; height: 100%; object-fit: cover; display: block; }
.detail-head h1 { font: 600 24px/1.2 var(--serif); margin: 0 0 6px; }
.detail-head .by { color: var(--muted); margin-bottom: 12px; }
.facts { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 22px 0; padding: 16px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; word-break: break-word; }
.blurb { font: 17px/1.6 var(--serif); white-space: pre-line; max-width: 65ch; }
.section-title { font-weight: 600; margin: 22px 0 6px; }
.actions { display: flex; gap: 10px; margin: 26px 0; flex-wrap: wrap; }
.actions .btn { flex: 1 1 140px; }
.pdf-btn { width: 100%; margin-top: 22px; }
.pdf-btn svg { width: 20px; height: 20px; }

/* Formular */
.form h1 { font: 700 26px var(--round); color: var(--olive); margin: 4px 0 14px; }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 5px; }
.field input, .field select, .field textarea { width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.field textarea { min-height: 120px; resize: vertical; line-height: 1.5; }
.inline { display: flex; gap: 8px; }
.inline input { flex: 1; min-width: 0; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 16px; }
.panel.isbn { border-color: var(--green); }
.status { font-size: 14px; margin-top: 8px; min-height: 1.2em; color: var(--muted); }
.status.ok { color: var(--green); }
.status.err { color: var(--danger); }
.cover-btn { width: 100%; margin-top: 10px; justify-content: center; }
.cover-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
.cover-row .cover-btn { margin-top: 0; }
.panel.isbn .cover-btn:first-child { margin-top: 0; }
.photo-row { display: flex; gap: 14px; align-items: center; }
.photo-row .cover-lg { width: 72px; font-size: 24px; box-shadow: none; }
.photo-row .btns { display: flex; flex-direction: column; gap: 8px; }

/* Einstellungen */
.settings h1 { font: 700 26px var(--round); color: var(--olive); margin: 4px 0 14px; }
.settings p { color: var(--muted); margin: 6px 0 12px; }
.settings .panel h2 { font-size: 17px; margin: 0 0 4px; }
.settings .panel .btn { width: 100%; margin-top: 8px; }

/* Scanner */
#scanner { position: fixed; inset: 0; background: #000; z-index: 20; display: flex; flex-direction: column; padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); color: #fff; }
#scanner[hidden] { display: none; }
#scan-hint { padding: 18px 20px 12px; text-align: center; font-size: 17px; }
#reader { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; }
#reader video { width: 100% !important; height: auto !important; max-height: 100%; object-fit: cover; }
.scan-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 14px 16px 16px; }
.scan-actions .btn { background: #222; color: #fff; border-color: #333; }

/* KI-Suche */
.ai-ask { display: flex; align-items: center; gap: 8px; width: 100%; margin: 8px 0 4px; padding: 12px 14px; border: 1px dashed var(--green); border-radius: 12px; background: var(--green-soft); color: var(--green); font-weight: 600; text-align: left; cursor: pointer; }
.ai-ask svg { width: 20px; height: 20px; flex: none; }
.ai-ask span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ai-box { margin: 10px 0 6px; border: 1px solid var(--green); border-radius: 14px; background: var(--surface); padding: 6px 12px 10px; }
.ai-box .list { border-top: 0; margin-top: 0; }
.ai-box .row:last-child { border-bottom: 0; }
.ai-head { display: flex; align-items: center; justify-content: space-between; color: var(--green); font-weight: 700; }
.ai-head span { display: inline-flex; align-items: center; gap: 6px; }
.ai-head svg { width: 18px; height: 18px; }
.ai-msg { margin: 4px 0 8px; color: var(--muted); }
.ai-msg.err { color: var(--danger); }
.row-why { font-size: 14px; color: var(--green); margin-top: 3px; font-style: italic; }

/* Dialog */
.dialog { position: fixed; inset: 0; z-index: 40; background: rgba(10,20,20,.45); display: flex; align-items: flex-end; justify-content: center; padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px)); }
.dialog[hidden] { display: none; }
.dialog-card { width: 100%; max-width: 440px; background: var(--surface); color: var(--ink); border-radius: 18px; padding: 20px; box-shadow: 0 12px 40px rgba(0,0,0,.25); }
.dialog-card p { margin: 0 0 14px; white-space: pre-line; font-size: 17px; line-height: 1.4; }
.dialog-card input { width: 100%; padding: 13px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); margin-bottom: 14px; font-size: 18px; }
.dialog-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.dialog-actions .btn.danger { background: var(--danger); color: #fff; border-color: var(--danger); }

/* Hinweis */
#toast { position: fixed; left: 16px; right: 16px; bottom: calc(var(--bar-h) + 20px + env(safe-area-inset-bottom, 0px)); max-width: 520px; margin: 0 auto; background: var(--ink); color: var(--paper); padding: 12px 16px; border-radius: 12px; z-index: 30; font-size: 15px; opacity: 0; transform: translateY(8px); transition: opacity .2s, transform .2s; pointer-events: none; }
#toast.show { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) { #toast { transition: none; } .btn:active { transform: none; } }
.preview-note { max-width: 720px; margin: 0 auto; padding: 10px 16px; font-size: 14px; color: var(--muted); border-bottom: 1px solid var(--line); }

<script>
'use strict';

/* ---------- Grundlagen ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => {
  const a = 'abcdefghijklmnopqrstuvwxyz0123456789';
  const r = crypto.getRandomValues(new Uint8Array(15));
  return Array.from(r, b => a[b % 36]).join('');
};
const validId = id => /^[a-z0-9]{15}$/.test(id);

const CATS = {
  buch: { label: 'Bücher', one: 'Buch' },
  spiel: { label: 'Spiele', one: 'Gesellschaftsspiel' },
  werkzeug: { label: 'Werkzeug', one: 'Werkzeug' },
  edv: { label: 'EDV', one: 'EDV-Artikel' },
  sonstiges: { label: 'Sonstiges', one: 'Gegenstand' },
};

const ICON = {
  search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  gear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  scan: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 8v8M11 8v8M14 8v8M17 8v8"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>',
  camera: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/></svg>',
  spark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg>',
  pdf: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M12 18v-6M9.5 15.5 12 18l2.5-2.5"/></svg>',
  close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  qr: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 20h4v-3"/></svg>',
};

let items = [];
let settings = { digits: 5 };
const listState = { q: '', cat: 'alle', sort: 'nummer', scroll: 0, ai: null };
let ai = { provider: 'openai', keys: {} };   // bleibt nur auf diesem Gerät
const AI_PROVIDERS = {
  openai: { label: 'ChatGPT (OpenAI)', model: 'gpt-6-luna', where: 'platform.openai.com', placeholder: 'sk-…', budget: 700000 },
  anthropic: { label: 'Claude (Anthropic)', model: 'claude-haiku-5-5', where: 'console.anthropic.com', placeholder: 'sk-ant-…', budget: 280000 },
};
const aiKeyNow = () => ai.keys[ai.provider] || '';
let currentView = '';

/* ---------- Speicher (IndexedDB, bleibt auf dem Gerät) ---------- */
const DB = (() => {
  let dbp;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open('inventar', 1);
    r.onupgradeneeded = () => {
      r.result.createObjectStore('items', { keyPath: 'id' });
      r.result.createObjectStore('meta');
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  }));
  const tx = async (store, mode, fn) => {
    const db = await open();
    return new Promise((res, rej) => {
      const t = db.transaction(store, mode);
      const req = fn(t.objectStore(store));
      t.oncomplete = () => res(req ? req.result : undefined);
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error);
    });
  };
  return {
    all: () => tx('items', 'readonly', s => s.getAll()),
    put: it => tx('items', 'readwrite', s => s.put(it)),
    putMany: list => tx('items', 'readwrite', s => { list.forEach(it => s.put(it)); return null; }),
    del: id => tx('items', 'readwrite', s => s.delete(id)),
    clear: () => tx('items', 'readwrite', s => s.clear()),
    getMeta: k => tx('meta', 'readonly', s => s.get(k)),
    setMeta: (k, v) => tx('meta', 'readwrite', s => s.put(v, k)),
  };
})();

async function saveItem(it) {
  it.updatedAt = Date.now();
  await DB.put(it);
  const i = items.findIndex(x => x.id === it.id);
  if (i >= 0) items[i] = it; else items.push(it);
  await Sync.queue('put', it.id);
}

async function deleteItem(id) {
  await DB.del(id);
  items = items.filter(x => x.id !== id);
  await Sync.queue('del', id);
}

/* ---------- Gemeinsamer Speicher (PocketBase) ---------- */
const Sync = (() => {
  let pb = null;
  let pending = [];           // [{op:'put'|'del', id}]
  let flushing = false;
  let state = 'local';        // local | syncing | ok | offline | error | login
  let lastSync = null;
  let unsub = null;
  const listeners = new Set();

  const setState = st => { state = st; listeners.forEach(f => f()); };
  const pendingIds = () => new Set(pending.map(p => p.id));
  const toRecord = it => { const data = { ...it }; delete data.id; return { data }; };
  const fromRecord = r => ({ ...(r.data || {}), id: r.id });

  async function init() {
    pending = (await DB.getMeta('queue')) || [];
    const server = await DB.getMeta('server');
    if (server && server.url && window.PocketBase) {
      connectClient(server.url);
      if (pb.authStore.isValid) start(); else setState('login');
    }
    window.addEventListener('online', () => sync());
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') sync(); });
  }

  function connectClient(url) {
    pb = new window.PocketBase(url.replace(/\/+$/, ''));
    pb.autoCancellation(false);
    // Jede Anfrage bekommt eine Zeitgrenze, damit der Abgleich nie endlos hängt
    pb.beforeSend = (url, options) => {
      if (!options.signal) {
        const c = new AbortController();
        setTimeout(() => c.abort(), 45000);
        options.signal = c.signal;
      }
      return { url, options };
    };
  }

  async function login(url, email, password) {
    connectClient(url);
    await pb.collection('users').authWithPassword(email, password);
    await DB.setMeta('server', { url: pb.baseURL || url });
    await start(true);
  }

  async function logout() {
    if (unsub) { try { await unsub(); } catch { /* egal */ } unsub = null; }
    if (pb) pb.authStore.clear();
    await DB.setMeta('server', null);
    pb = null;
    setState('local');
  }

  async function start(firstLogin) {
    // Alte Einträge aus der reinen Handy-Version bekommen gültige IDs
    for (const it of [...items]) {
      if (validId(it.id)) continue;
      const neu = { ...it, id: uid() };
      await DB.del(it.id); await DB.put(neu);
      items = items.map(x => x.id === it.id ? neu : x);
      pending = pending.filter(p => p.id !== it.id);
      pending.push({ op: 'put', id: neu.id });
    }
    await DB.setMeta('queue', pending);
    await sync(firstLogin);
    subscribe();
  }

  async function subscribe() {
    if (!pb || unsub) return;
    try {
      unsub = await pb.collection('items').subscribe('*', async e => {
        if (pendingIds().has(e.record.id)) return;
        if (e.action === 'delete') {
          await DB.del(e.record.id);
          items = items.filter(x => x.id !== e.record.id);
        } else {
          const it = fromRecord(e.record);
          await DB.put(it);
          const i = items.findIndex(x => x.id === it.id);
          if (i >= 0) items[i] = it; else items.push(it);
        }
        refreshView();
      });
    } catch { /* Live-Aktualisierung ist ein Extra */ }
  }

  async function queue(op, id) {
    pending = pending.filter(p => p.id !== id);
    pending.push({ op, id });
    await DB.setMeta('queue', pending);
    flush();
  }

  async function flush() {
    if (!pb || !pb.authStore.isValid || flushing) return;
    if (!navigator.onLine) { setState('offline'); return; }
    flushing = true;
    setState('syncing');
    try {
      while (pending.length) {
        const job = pending[0];
        if (job.op === 'del') {
          try { await pb.collection('items').delete(job.id); }
          catch (e) { if (e.status !== 404) throw e; }
        } else {
          const it = items.find(x => x.id === job.id);
          if (it) {
            try { await pb.collection('items').update(it.id, toRecord(it)); }
            catch (e) {
              if (e.status === 404) await pb.collection('items').create({ id: it.id, ...toRecord(it) });
              else throw e;
            }
          }
        }
        pending.shift();
        await DB.setMeta('queue', pending);
        setState('syncing');
      }
      lastSync = new Date();
      setState('ok');
    } catch (e) {
      handleError(e);
    } finally {
      flushing = false;
    }
  }

  function handleError(e) {
    if (e && e.isAbort) setState('timeout');
    else if (e && e.status === 401) { pb.authStore.clear(); setState('login'); }
    else if (e && e.status === 403) setState('rules');
    else if (!navigator.onLine || (e && e.status === 0)) setState('offline');
    else setState('error');
  }

  let syncing = false;
  async function sync(firstLogin) {
    if (!pb || !pb.authStore.isValid || syncing) return;
    syncing = true;
    try { await doSync(firstLogin); } finally { syncing = false; }
  }

  async function doSync(firstLogin) {
    if (!navigator.onLine) { setState('offline'); return; }
    setState('syncing');
    try {
      const recs = await pb.collection('items').getFullList({ batch: 500 });
      const remote = new Map(recs.map(r => [r.id, fromRecord(r)]));
      const waiting = pendingIds();
      const synced = await DB.getMeta('synced');
      // Beim allerersten Verbinden werden die Handy-Daten hochgeladen statt verworfen
      if (firstLogin || !synced) {
        for (const it of items) if (!remote.has(it.id) && !waiting.has(it.id)) pending.push({ op: 'put', id: it.id });
        await DB.setMeta('queue', pending);
        await DB.setMeta('synced', true);
      }
      const keep = pendingIds();
      const merged = [];
      for (const [id, it] of remote) merged.push(keep.has(id) ? (items.find(x => x.id === id) || it) : it);
      for (const it of items) if (!remote.has(it.id) && keep.has(it.id)) merged.push(it);
      await DB.clear();
      await DB.putMany(merged);
      items = merged;
      refreshView();
      lastSync = new Date();
      setState('ok');
      await flush();
    } catch (e) {
      handleError(e);
    }
  }

  return {
    init, login, logout, queue, sync,
    onChange: f => listeners.add(f),
    get state() { return state; },
    get pending() { return pending.length; },
    get lastSync() { return lastSync; },
    get user() { return pb && pb.authStore.record ? (pb.authStore.record.email || pb.authStore.record.name || '') : ''; },
    get url() { return pb ? pb.baseURL : ''; },
  };
})();

function syncLabel() {
  const n = Sync.pending ? (Sync.pending === 1 ? '1 Änderung wartet' : `${Sync.pending} Änderungen warten`) : '';
  switch (Sync.state) {
    case 'local': return 'Nur auf diesem Gerät';
    case 'syncing': return Sync.pending > 1 ? `Wird abgeglichen, noch ${Sync.pending} Einträge …` : 'Wird abgeglichen …';
    case 'timeout': return n ? `Server antwortet nicht, ${n}. Tipp auf „Jetzt abgleichen“` : 'Server antwortet nicht. Tipp auf „Jetzt abgleichen“';
    case 'ok': return n || 'Gemeinsam gespeichert';
    case 'offline': return n ? `Offline, ${n}` : 'Offline';
    case 'login': return 'Bitte neu anmelden (Einstellungen)';
    case 'rules': return 'Server verweigert den Zugriff (API-Regeln prüfen)';
    default: return n ? `Abgleich fehlgeschlagen, ${n}` : 'Abgleich fehlgeschlagen';
  }
}

function refreshView() {
  if (currentView === 'list') {
    if (document.activeElement && document.activeElement.id === 'q') { renderRows(); return; }
    listState.scroll = window.scrollY;
    renderList();
  } else if (currentView === 'item') {
    const id = location.hash.split('/')[2];
    renderDetail(id);
  }
}

Sync.onChange(() => {
  const el = $('#sync');
  if (el) { el.textContent = syncLabel(); el.dataset.state = Sync.state; }

/* ---------- Hilfen ---------- */
function toast(msg, ms = 2800) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => t.classList.remove('show'), ms);
}

const fmtNum = n => (n === null || n === undefined || n === '') ? '' : String(n).padStart(settings.digits, '0');
const tagHtml = (n, big) => n === null || n === undefined || n === ''
  ? `<span class="tag none${big ? ' big' : ''}">ohne Nr.</span>`
  : `<span class="tag${big ? ' big' : ''}">${fmtNum(n)}</span>`;

function parseSticker(text) {
  const m = String(text).match(/\d+/g);
  if (!m) return null;
  const raw = m.length === 1 ? m[0] : m[m.length - 1];
  return { num: parseInt(raw, 10), raw };
}

const fmtDate = t => new Date(t).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' });
function sinceText(t) {
  const d = Math.floor((new Date().setHours(0, 0, 0, 0) - new Date(t).setHours(0, 0, 0, 0)) / 86400000);
  return d <= 0 ? 'seit heute' : d === 1 ? 'seit gestern' : `seit ${d} Tagen`;
}
function borrowerNames() {
  const set = new Set();
  items.forEach(it => { if (it.loan) set.add(it.loan.name); (it.loans || []).forEach(l => set.add(l.name)); });
  return [...set].sort((a, b) => a.localeCompare(b, 'de'));
}

const byNumber = n => items.find(x => x.number === n);
const maxNumber = () => items.reduce((m, x) => (typeof x.number === 'number' && x.number > m ? x.number : m), -1);

function initials(t) {
  return esc((t || '?').trim().charAt(0).toUpperCase() || '?');
}

function coverHtml(it, cls) {
  const square = it.category !== 'buch' ? ' square' : '';
  const chain = [it.photo, it.cover, ...String(it.coverAlt || '').split('|')].filter(Boolean);
  const src = chain[0];
  const alt = chain.slice(1).join('|');
  if (!src) return `<div class="${cls}${square}">${initials(it.title)}</div>`;
  return `<div class="${cls}${square}" data-initial="${initials(it.title)}"><img src="${esc(src)}" ${alt ? `data-alt="${esc(alt)}"` : ''} alt="" loading="lazy" referrerpolicy="no-referrer"></div>`;
}

// Kaputte Cover: Ersatzbild versuchen, sonst Anfangsbuchstabe zeigen
document.addEventListener('error', e => {
  const img = e.target;
  if (!(img instanceof HTMLImageElement) || !img.closest('.thumb, .cover-lg')) return;
  if (img.dataset.alt) {
    const [next, ...rest] = img.dataset.alt.split('|');
    if (rest.length) img.dataset.alt = rest.join('|'); else delete img.dataset.alt;
    img.src = next; return;
  }
  const box = img.parentElement;
  box.textContent = box.dataset.initial ? new DOMParser().parseFromString(box.dataset.initial, 'text/html').body.textContent : '?';
}, true);

/* ---------- Dialoge ---------- */
function ask({ message, input = false, okLabel = 'OK', inputmode = 'text', danger = false }) {
  return new Promise(res => {
    const d = $('#dialog'), inp = $('#dlg-input'), ok = $('#dlg-ok'), cancel = $('#dlg-cancel');
    $('#dlg-msg').textContent = message;
    inp.hidden = !input; inp.value = ''; inp.inputMode = inputmode;
    ok.textContent = okLabel;
    ok.className = 'btn ' + (danger ? 'danger' : 'primary');
    d.hidden = false;
    setTimeout(() => (input ? inp : ok).focus(), 50);
    const done = v => { d.hidden = true; ok.onclick = cancel.onclick = inp.onkeydown = null; res(v); };
    ok.onclick = () => done(input ? inp.value : true);
    cancel.onclick = () => done(input ? null : false);
    inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); ok.click(); } };
  });
}
const askConfirm = (message, okLabel = 'OK', danger = false) => ask({ message, okLabel, danger });
const askText = (message, inputmode = 'numeric') => ask({ message, input: true, okLabel: 'Übernehmen', inputmode });

/* ---------- ISBN ---------- */
const cleanIsbn = s => String(s || '').toUpperCase().replace(/[^0-9X]/g, '');

function validIsbn(s) {
  if (/^\d{13}$/.test(s)) {
    let sum = 0;
    for (let i = 0; i < 12; i++) sum += +s[i] * (i % 2 ? 3 : 1);
    return (10 - sum % 10) % 10 === +s[12];
  }
  if (/^\d{9}[\dX]$/.test(s)) {
    let sum = 0;
    for (let i = 0; i < 9; i++) sum += +s[i] * (10 - i);
    return (sum + (s[9] === 'X' ? 10 : +s[9])) % 11 === 0;
  }
  return false;
}

function toIsbn13(s) {
  if (s.length !== 10) return s;
  const b = '978' + s.slice(0, 9);
  let sum = 0;
  for (let i = 0; i < 12; i++) sum += +b[i] * (i % 2 ? 3 : 1);
  return b + ((10 - sum % 10) % 10);
}

async function fetchJson(url, ms = 9000) {
  const c = new AbortController();
  const t = setTimeout(() => c.abort(), ms);
  try {
    const r = await fetch(url, { signal: c.signal });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  } finally { clearTimeout(t); }
}

function htmlToText(h) {
  const prepared = String(h).replace(/<br\s*\/?>/gi, '\n').replace(/<\/p>/gi, '\n\n');
  return new DOMParser().parseFromString(prepared, 'text/html').body.textContent.replace(/\n{3,}/g, '\n\n').trim();
}

const year = d => (String(d || '').match(/\d{4}/) || [''])[0];

async function lookupGoogle(isbn) {
  const d = await fetchJson(`https://www.googleapis.com/books/v1/volumes?q=isbn:${isbn}`);
  if (!d.items || !d.items.length) return null;
  let v = d.items[0].volumeInfo || {};
  try {
    const full = await fetchJson(d.items[0].selfLink);
    if (full.volumeInfo) v = { ...v, ...full.volumeInfo };
  } catch { /* Kurzdaten reichen auch */ }
  const img = v.imageLinks || {};
  let cover = img.large || img.medium || img.small || img.thumbnail || img.smallThumbnail || '';
  cover = cover.replace(/^http:/, 'https:').replace('&edge=curl', '');
  return {
    title: v.subtitle ? `${v.title} – ${v.subtitle}` : (v.title || ''),
    author: (v.authors || []).join(', '),
    year: year(v.publishedDate),
    publisher: v.publisher || '',
    description: v.description ? htmlToText(v.description) : '',
    pages: v.pageCount ? String(v.pageCount) : '',
    cover,
  };
}

async function lookupOpenLibrary(isbn) {
  const d = await fetchJson(`https://openlibrary.org/api/books?bibkeys=ISBN:${isbn}&jscmd=data&format=json`);
  const b = d[`ISBN:${isbn}`];
  if (!b) return null;
  return {
    title: b.subtitle ? `${b.title} – ${b.subtitle}` : (b.title || ''),
    author: (b.authors || []).map(a => a.name).join(', '),
    year: year(b.publish_date),
    publisher: (b.publishers || []).map(p => p.name).join(', '),
    description: typeof b.excerpts?.[0]?.text === 'string' ? b.excerpts[0].text : '',
    pages: b.number_of_pages ? String(b.number_of_pages) : '',
    cover: (b.cover && (b.cover.large || b.cover.medium)) || '',
  };
}

function jsonp(url, ms = 9000) {
  return new Promise((res, rej) => {
    const cb = '__jp' + Math.random().toString(36).slice(2);
    const sc = document.createElement('script');
    const done = () => { clearTimeout(t); delete window[cb]; sc.remove(); };
    const t = setTimeout(() => { done(); rej(new Error('timeout')); }, ms);
    window[cb] = d => { done(); res(d); };
    sc.onerror = () => { done(); rej(new Error('jsonp')); };
    sc.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + cb;
    document.head.appendChild(sc);
  });
}

const flipName = n => /,/.test(n) ? n.split(',').map(x => x.trim()).reverse().join(' ') : n;

// Deutscher Bibliotheksverbund (hbz) über lobid.org: findet auch viele Kinderbücher
async function lookupLobid(isbn) {
  const d = await jsonp(`https://lobid.org/resources/search?q=isbn:${isbn}&format=json&size=1`);
  const b = d && d.member && d.member[0];
  if (!b) return null;
  const contrib = (b.contribution || []).filter(c => c.agent && c.agent.label);
  const authors = contrib.filter(c => /Autor|Verfasser/i.test((c.role && c.role.label) || ''));
  const pub = (b.publication || [])[0] || {};
  const other = Array.isArray(b.otherTitleInformation) ? b.otherTitleInformation[0] : '';
  return {
    title: [b.title, other].filter(Boolean).join(' – '),
    author: (authors.length ? authors : contrib.slice(0, 2)).map(c => flipName(c.agent.label)).join(', '),
    year: year(pub.startDate),
    publisher: (pub.publishedBy || []).join(', '),
    pages: ((String(b.extent || '').match(/(\d+)\]?\s*(S\.|Seiten|ungezählte)/) || [])[1]) || '',
    description: '',
    cover: '',
  };
}

async function lookupIsbn(isbn) {
  const res = await Promise.allSettled([lookupGoogle(isbn), lookupLobid(isbn), lookupOpenLibrary(isbn)]);
  if (res.every(r => r.status === 'rejected')) throw new Error('offline');
  const [G, L, O] = res.map(r => (r.status === 'fulfilled' ? r.value : null));
  if (!G && !L && !O) return null;
  const pick = (k, order = [G, L, O]) => { for (const x of order) if (x && x[k]) return x[k]; return ''; };
  const covers = [O && O.cover, G && G.cover,
    `https://portal.dnb.de/opac/mvb/cover?isbn=${isbn}`,
    `https://covers.openlibrary.org/b/isbn/${isbn}-L.jpg?default=false`].filter(Boolean);
  return {
    title: pick('title'), author: pick('author'),
    year: pick('year', [L, G, O]), publisher: pick('publisher', [L, G, O]),
    description: pick('description'), pages: pick('pages'),
    cover: covers[0], coverAlt: covers.slice(1).join('|'),
  };
}

/* ---------- Scanner ---------- */
let scanner = null;
let scanMode = 'any';
let scanCallback = null;

const SCAN_HINTS = {
  any: 'Buch-Barcode oder Inventaraufkleber vor die Kamera halten',
  isbn: 'Barcode auf der Buchrückseite vor die Kamera halten',
  sticker: 'QR-Code des Inventaraufklebers vor die Kamera halten',
};

function openScanner(mode, onResult) {
  const L = window.__Html5QrcodeLibrary__;
  if (!L) { manualEntry(mode, onResult, window.PREVIEW ? 'In der Vorschau ist die Kamera gesperrt. In deiner eigenen App scannst du hier.' : 'Der Scanner ist gerade nicht verfügbar.'); return; }
  scanMode = mode;
  scanCallback = onResult;
  $('#scan-hint').textContent = SCAN_HINTS[mode];
  $('#scanner').hidden = false;
  const F = L.Html5QrcodeSupportedFormats;
  const formats = mode === 'isbn' ? [F.EAN_13, F.EAN_8, F.UPC_A]
    : mode === 'sticker' ? [F.QR_CODE]
    : [F.QR_CODE, F.EAN_13, F.EAN_8, F.UPC_A];
  const s = new L.Html5Qrcode('reader', {
    formatsToSupport: formats, verbose: false,
    experimentalFeatures: { useBarCodeDetectorIfSupported: true },
  });
  scanner = s;
  let done = false;
  s.startP = s.start(
    { facingMode: 'environment' },
    {
      fps: 12,
      qrbox: (w, h) => {
        const m = Math.min(w, h);
        return mode === 'sticker'
          ? { width: Math.max(80, Math.floor(m * 0.7)), height: Math.max(80, Math.floor(m * 0.7)) }
          : { width: Math.max(120, Math.floor(w * 0.85)), height: Math.max(80, Math.floor(Math.min(h * 0.45, w * 0.45))) };
      },
    },
    (text, res) => {
      if (done) return;
      done = true;
      if (navigator.vibrate) navigator.vibrate(60);
      const fmt = res && res.result && res.result.format ? res.result.format.formatName : '';
      closeScanner().then(() => onResult(text, fmt));
    },
    () => {}
  ).catch(err => {
    closeScanner();
    const msg = String(err && err.message || err);
    manualEntry(mode, onResult, window.PREVIEW
      ? 'In der Vorschau ist die Kamera gesperrt. In deiner eigenen App scannst du hier.'
      : /permission|NotAllowed/i.test(msg)
        ? 'Kein Kamerazugriff. Erlaube die Kamera für diese Seite in den Einstellungen deines Handys.'
        : 'Die Kamera ließ sich nicht starten.');
  });
}

async function closeScanner() {
  const s = scanner;
  scanner = null;
  $('#scanner').hidden = true;
  if (!s) return;
  try { await s.startP; } catch { /* egal */ }
  try { if (s.isScanning) await s.stop(); } catch { /* egal */ }
  try { s.clear(); } catch { /* egal */ }
}

$('#scan-cancel').addEventListener('click', () => closeScanner());
async function manualEntry(mode, cb, reason) {
  const label = mode === 'isbn' ? 'ISBN eintippen' : mode === 'sticker' ? 'Inventarnummer vom Aufkleber eintippen' : 'ISBN oder Inventarnummer eintippen';
  const v = await askText(reason ? `${reason}\n\n${label}:` : `${label}:`);
  if (!v || !v.trim()) return;
  const digits = cleanIsbn(v);
  const fmt = mode === 'sticker' ? 'QR_CODE' : mode === 'isbn' ? 'EAN_13' : (digits.length >= 10 ? 'EAN_13' : 'QR_CODE');
  cb && cb(v.trim(), fmt);
}

$('#scan-type').addEventListener('click', async () => {
  const mode = scanMode, cb = scanCallback;
  await closeScanner();
  manualEntry(mode, cb);
});

function looksLikeIsbn(text, fmt) {
  if (fmt === 'QR_CODE') return false;
  const c = cleanIsbn(text);
  return /^97[89]\d{10}$/.test(c) || (fmt && fmt !== 'QR_CODE' && validIsbn(c));
}

// Scan von der Startseite: Aufkleber öffnet den Eintrag oder legt einen neuen an
function universalScan() {
  openScanner('sticker', async (text) => {
    const st = parseSticker(text);
    if (!st) { toast('Diesen Code kenne ich nicht.'); return; }
    learnDigits(st.raw);
    const hit = byNumber(st.num);
    if (hit) { openScanned(hit); return; }
    if (await askConfirm(`Nummer ${fmtNum(st.num)} ist noch frei. Neuen Eintrag mit dieser Nummer anlegen?`, 'Anlegen')) {
      location.hash = `#/new?cat=buch&num=${st.num}`;
    }
  });
}

  await saveItem({ ...it, loan: null, loans: [...(it.loans || []), entry] });

// Beim ersten gescannten Aufkleber die Stellenzahl (z. B. 00123) übernehmen
function learnDigits(raw) {
  if (settings.learned || !/^\d+$/.test(raw) || raw.length < 2 || raw.length > 8) return;
  settings.digits = raw.length;
  settings.learned = true;
  DB.setMeta('settings', settings);
}

/* ---------- KI-Suche ---------- */
function aiPrompt(query, budget) {
  let len = 300, rows;
  do {
    rows = items.map(it => JSON.stringify({
      id: it.id, nr: fmtNum(it.number), art: CATS[it.category]?.one || '', titel: it.title || '',
      von: it.author || it.brand || it.publisher || '', jahr: it.year || '',
      inhalt: (it.description || '').slice(0, len), notiz: (it.notes || '').slice(0, Math.min(120, len)),
    }));
    len = Math.floor(len * 0.7);
  } while (budget && rows.join('\n').length > budget && len > 20);
  return `Du hilfst, in einem privaten Inventar (Bücher, Gesellschaftsspiele, Werkzeug, EDV) Einträge anhand einer frei formulierten Beschreibung zu finden.

Suchanfrage: "${query}"

Inventar, ein Eintrag pro Zeile:
${rows.join('\n')}

Nutze Titel, Autor, Inhaltstext und dein Wissen über bekannte Bücher und Spiele. Gib höchstens 5 passende Einträge zurück, den besten zuerst. Wenn nichts wirklich passt, gib eine leere Liste zurück.
Antworte nur mit JSON in genau dieser Form, ohne weiteren Text:
{"treffer":[{"id":"<id aus der Liste>","grund":"kurze Begründung auf Deutsch, höchstens 15 Wörter"}]}`;
}

async function aiSearch(query) {
  if (window.PREVIEW) {
    const prompt = aiPrompt(query, 200000);
    const sample = window.claude ? await window.claude.use('sample') : null;
    if (!sample) throw { code: 'unavailable' };
    return sample.json(prompt, { modelTier: 'quick' });
  }
  return aiComplete(aiPrompt(query, AI_PROVIDERS[ai.provider].budget));
}

// Schickt eine Anfrage (optional mit Foto) an den gewählten Anbieter und liefert das JSON der Antwort
async function aiComplete(prompt, image) {
  const key = aiKeyNow();
  if (!key) throw { code: 'nokey' };
  if (!navigator.onLine) throw { code: 'offline' };
  const P = AI_PROVIDERS[ai.provider];
  const oaContent = image ? [{ type: 'text', text: prompt }, { type: 'image_url', image_url: { url: image } }] : prompt;
  const anContent = image
    ? [{ type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: image.split(',')[1] } }, { type: 'text', text: prompt }]
    : prompt;
  let r;
  try {
    r = ai.provider === 'openai'
      ? await fetch('https://api.openai.com/v1/chat/completions', {
          method: 'POST',
          headers: { 'content-type': 'application/json', authorization: `Bearer ${key}` },
          body: JSON.stringify({ model: P.model, max_completion_tokens: 4000, messages: [{ role: 'user', content: oaContent }] }),
        })
      : await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          headers: {
            'content-type': 'application/json',
            'x-api-key': key,
            'anthropic-version': '2023-06-01',
            'anthropic-dangerous-direct-browser-access': 'true',
          },
          body: JSON.stringify({ model: P.model, max_tokens: 1000, messages: [{ role: 'user', content: anContent }] }),
        });
  } catch { throw { code: 'offline' }; }
  if (!r.ok) throw { code: r.status === 401 ? 'badkey' : r.status === 429 ? 'rate_limited' : r.status === 402 ? 'credit' : 'http' };
  const d = await r.json();
  const text = ai.provider === 'openai'
    ? ((d.choices && d.choices[0] && d.choices[0].message && d.choices[0].message.content) || '')
    : (d.content || []).filter(b => b.type === 'text').map(b => b.text).join('');
  const clean = text.replace(/```json|```/g, '').trim();
  const m = clean.match(/\{[\s\S]*\}/);
  return JSON.parse(m ? m[0] : clean);
}

const AI_ERRORS = {
  nokey: 'Für die KI-Suche fehlt noch der API-Schlüssel. Du hinterlegst ihn unter Einstellungen.',
  badkey: 'Der API-Schlüssel wurde abgelehnt. Prüf ihn unter Einstellungen.',
  offline: 'Für die KI-Suche brauchst du Internet.',
  rate_limited: 'Gerade zu viele Anfragen oder das Guthaben ist aufgebraucht. Prüf dein Guthaben beim Anbieter.',
  credit: 'Das Guthaben beim KI-Anbieter ist aufgebraucht.',
  not_granted: 'Die KI-Anfrage wurde nicht erlaubt.',
  unavailable: 'Die KI-Suche ist hier gerade nicht verfügbar.',
  preview: 'Die Cover-Erkennung funktioniert in deiner eigenen App, nicht in dieser Vorschau.',
};

async function runAiSearch() {
  const q = listState.q.trim();
  if (!q) return;
  listState.ai = { q, loading: true };
  renderRows();
  try {
    const res = await aiSearch(q);
    const hits = (res && Array.isArray(res.treffer) ? res.treffer : [])
      .map(h => ({ it: items.find(x => x.id === h.id), why: String(h.grund || '') }))
      .filter(h => h.it);
    if (listState.ai && listState.ai.q === q) listState.ai = { q, hits };
  } catch (e) {
    if (listState.ai && listState.ai.q === q) listState.ai = { q, error: AI_ERRORS[e && e.code] || 'Die KI-Suche hat nicht geklappt. Versuch es noch einmal.', code: e && e.code };
  }
  if (currentView === 'list') renderRows();
}

/* ---------- Ansicht: Liste ---------- */
function filtered() {
  const q = listState.q.trim().toLowerCase();
  const qNum = /^\d+$/.test(q) ? parseInt(q, 10) : null;
  let list = items.filter(it => listState.cat === 'alle' || (listState.cat === 'ausgeliehen' ? !!it.loan : it.category === listState.cat));
  if (q) {
    list = list.filter(it => {
      if (qNum !== null && it.number === qNum) return true;
      return [it.title, it.author, it.publisher, it.isbn, it.description, it.brand, it.model, it.serial, it.location, it.notes, fmtNum(it.number), it.loan && it.loan.name]
        .some(v => v && String(v).toLowerCase().includes(q));
    });
  }
  const s = listState.sort;
  list.sort((a, b) => {
    if (s === 'titel') return (a.title || '').localeCompare(b.title || '', 'de');
    if (s === 'neu') return (b.createdAt || 0) - (a.createdAt || 0);
    const an = typeof a.number === 'number' ? a.number : Infinity;
    const bn = typeof b.number === 'number' ? b.number : Infinity;
    return an - bn || (a.title || '').localeCompare(b.title || '', 'de');
  });
  return list;
}

function subline(it) {
  if (it.category === 'buch') return [it.author, it.year].filter(Boolean).join(', ');
  if (it.category === 'spiel') return [it.publisher, it.players && `${it.players} Spieler`, it.age && `ab ${it.age}`].filter(Boolean).join(', ') || 'Gesellschaftsspiel';
  return [it.brand, it.model].filter(Boolean).join(' ') || CATS[it.category]?.one || '';
}

function renderRows() {
  const list = filtered();
  const box = $('#rows');
  if (!items.length) {
    box.innerHTML = `<div class="empty"><h2>Noch nichts erfasst</h2><p>Tippe auf „Hinzufügen“ und fotografiere Vorder- und Rückseite eines Buches, um anzufangen.</p></div>`;
    return;
  }
  if (!list.length) {
    const ai = aiHtml();
    box.innerHTML = ai + (listState.ai ? '' : `<div class="empty"><p>Nichts gefunden. Prüf die Schreibweise${ai ? ' oder lass Claude suchen' : ' oder wähle „Alle“'}.</p></div>`);
    bindAi();
    return;
  }
  box.innerHTML = aiHtml() + (listState.ai ? '<div class="section-title">Normale Suche</div>' : '') + `<div class="list">${list.map(it => rowHtml(it)).join('')}</div>`;

}

  const q = listState.q.trim();

  if (q.length >= 3 && items.length) return `<button class="ai-ask" id="ai-go">${ICON.spark}<span>Mit KI suchen: „${esc(q)}“</span></button>`;
  return '';
}

        <option value="nummer"${listState.sort === 'nummer' ? ' selected' : ''}>nach Nummer</option>
        <option value="titel"${listState.sort === 'titel' ? ' selected' : ''}>nach Titel</option>
        <option value="neu"${listState.sort === 'neu' ? ' selected' : ''}>zuletzt erfasst</option>
      </select>
    </div>
    <div id="rows"></div>
    <nav class="bar"><div class="bar-inner">
      <button class="btn lime" id="scan-btn">${ICON.scan}Scannen</button>
      <a class="btn" href="#/new">${ICON.plus}Hinzufügen</a>
    </div></nav>`;
  renderRows();
  $('#q').addEventListener('input', e => {
    listState.q = e.target.value;
    if (listState.ai && listState.ai.q !== listState.q.trim()) listState.ai = null;
    renderRows();
  });
  $('#q').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); if (listState.q.trim().split(/\s+/).length >= 3) runAiSearch(); } });
  $('#sort').addEventListener('change', e => { listState.sort = e.target.value; renderRows(); });
  document.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => {
    listState.cat = b.dataset.cat;
    document.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', x === b));
    renderRows();
  }));
  $('#scan-btn').addEventListener('click', universalScan);
  requestAnimationFrame(() => window.scrollTo(0, listState.scroll));
}

/* ---------- Ansicht: Detail ---------- */
function renderDetail(id) {
  const it = items.find(x => x.id === id);
  if (!it) { location.hash = '#/'; return; }
  const book = it.category === 'buch';
  const facts = book
    ? [['Erscheinungsjahr', it.year], ['Verlag', it.publisher], ['ISBN', it.isbn], ['Seiten', it.pages]]
    : it.category === 'spiel'
    ? [['Kategorie', 'Gesellschaftsspiel'], ['Verlag', it.publisher], ['Spieler', it.players], ['Alter', it.age ? `ab ${it.age} Jahren` : ''], ['Spieldauer', it.duration ? `${it.duration} Minuten` : '']]
    : [['Kategorie', CATS[it.category]?.one], ['Hersteller', it.brand], ['Modell', it.model], ['Seriennummer', it.serial],
       ['Kaufdatum', it.purchaseDate ? new Date(it.purchaseDate).toLocaleDateString('de-DE') : ''], ['Kaufpreis', it.price ? `${it.price} €` : '']];
  const shown = facts.filter(f => f[1]);
  $('#view').innerHTML = `
    <a class="back" href="#/">${ICON.back}Inventar</a>
    <div class="detail-head">
      ${coverHtml(it, 'cover-lg')}
      <div>
        <h1>${esc(it.title || 'Ohne Titel')}</h1>
        ${book && it.author ? `<div class="by">${esc(it.author)}</div>` : ''}
        ${tagHtml(it.number, true)}
      </div>
    </div>
    <div class="loan-box${it.loan ? ' out' : ''}">
      ${it.loan ? `
        <div class="loan-head">
          <div><div class="loan-title">Ausgeliehen an ${esc(it.loan.name)}</div><div class="loan-sub">${sinceText(it.loan.since)}, am ${fmtDate(it.loan.since)}</div></div>
          <div class="loan-btns">
            <button class="iconbtn hist-btn" id="hist-btn" aria-expanded="false" aria-controls="history" aria-label="Verlauf anzeigen">${ICON.clock}</button>
            <button class="btn primary" id="return">Rückgabe</button>
          </div>
        </div>` : `
        <div class="loan-label">
          <label for="loan-name">Ausleihen an</label>
          <button class="iconbtn hist-btn" id="hist-btn" aria-expanded="false" aria-controls="history" aria-label="Verlauf anzeigen">${ICON.clock}${(it.loans || []).length ? `<span class="hist-count">${it.loans.length}</span>` : ''}</button>
        </div>
        <div class="inline">
          <input id="loan-name" list="borrowers" placeholder="Name" autocomplete="off" enterkeyhint="done">
          <button class="btn primary" id="lend">Ausleihen</button>
        </div>
        <datalist id="borrowers">${borrowerNames().map(n => `<option value="${esc(n)}">`).join('')}</datalist>`}
      <div id="history" class="history-box" hidden>
        <div class="history-title">Verlauf</div>
        ${it.loan || (it.loans || []).length ? `<ul class="history">
          ${it.loan ? `<li class="now"><span>${esc(it.loan.name)}</span><span>seit ${fmtDate(it.loan.since)}</span></li>` : ''}
          ${[...(it.loans || [])].sort((a, b) => b.from - a.from).map(l =>
            `<li><span>${esc(l.name)}</span><span>${fmtDate(l.from)} bis ${fmtDate(l.to)}</span></li>`).join('')}
        </ul>` : '<p class="history-empty">Noch nie verliehen.</p>'}
      </div>
    </div>
    ${shown.length ? `<dl class="facts">${shown.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl>` : '<div style="height:16px"></div>'}
    ${it.description ? `<div class="section-title">Inhalt</div><div class="blurb">${esc(it.description)}</div>` : ''}
    ${it.notes ? `<div class="section-title">Notizen</div><div class="blurb">${esc(it.notes)}</div>` : ''}

    <button class="btn pdf-btn" id="pdf">${ICON.pdf}Als PDF teilen</button>
    <div class="actions">
      <a class="btn primary" href="#/edit/${esc(it.id)}">Bearbeiten</a>
      <button class="btn danger" id="del">Löschen</button>
    </div>`;
  const lend = async () => {
    const name = $('#loan-name').value.trim();
    if (!name) { toast('Gib ein, an wen du das ausleihst.'); $('#loan-name').focus(); return; }
    await saveItem({ ...it, loan: { name, since: Date.now() } });
    toast(`An ${name} ausgeliehen.`);
    renderDetail(it.id);
  };
  $('#hist-btn').addEventListener('click', e => {
    const box = $('#history');
    box.hidden = !box.hidden;
    e.currentTarget.setAttribute('aria-expanded', String(!box.hidden));
  });
  if ($('#lend')) {
    $('#lend').addEventListener('click', lend);
    $('#loan-name').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); lend(); } });
  }
  if ($('#return')) $('#return').addEventListener('click', async () => {
    await returnItem(it);
    renderDetail(it.id);
  });
  $('#pdf').addEventListener('click', e => exportItemPdf(it, e.currentTarget));
  $('#del').addEventListener('click', async () => {
    if (!await askConfirm(`„${it.title || 'Eintrag'}“ wirklich löschen?`, 'Löschen', true)) return;
    await deleteItem(it.id);
    toast('Gelöscht.');

/* ---------- Ansicht: Formular ---------- */
let draft = null;

function field(key, label, opts = {}) {
  const v = draft[key] ?? '';
  const type = opts.type || 'text';
  if (type === 'textarea') return `<div class="field"><label for="f-${key}">${label}</label><textarea id="f-${key}" data-k="${key}">${esc(v)}</textarea></div>`;
  return `<div class="field"><label for="f-${key}">${label}</label><input id="f-${key}" data-k="${key}" type="${type}" value="${esc(v)}" ${opts.attrs || ''}></div>`;
}

function renderForm(id, params) {
  const editing = id ? items.find(x => x.id === id) : null;
  if (id && !editing) { location.hash = '#/'; return; }
  if (!draft || draft._for !== (id || 'new:' + params.toString())) {
    draft = editing ? { ...editing } : {
      id: uid(), category: params.get('cat') || 'buch', createdAt: Date.now(),
      number: params.has('num') ? parseInt(params.get('num'), 10) : null,
      isbn: params.get('isbn') || '',
    };
    draft._for = id || 'new:' + params.toString();
    draft._series = params.get('series') === '1';
  }
  const book = draft.category === 'buch';
  const isNew = !editing;

  $('#view').innerHTML = `
    <a class="back" href="${editing ? `#/item/${esc(editing.id)}` : '#/'}">${ICON.back}${editing ? 'Zurück' : 'Inventar'}</a>
    <div class="form">
      <h1>${isNew ? `Neu: ${CATS[draft.category].one}` : 'Bearbeiten'}</h1>
      <div class="field"><label for="f-category">Kategorie</label>
        <select id="f-category">${Object.entries(CATS).map(([k, c]) => `<option value="${k}"${k === draft.category ? ' selected' : ''}>${c.one}</option>`).join('')}</select>
      </div>

      ${book ? `
      <div class="panel isbn">
        <div class="cover-row">
          <button class="btn small cover-btn" data-side="front">${ICON.camera}Vorderseite</button>
          <button class="btn small cover-btn" data-side="back">${ICON.camera}Rückseite</button>
        </div>
        <div class="status" id="cover-status"></div>
      </div>` : draft.category === 'spiel' ? `
      <div class="panel isbn">
        <button class="btn small cover-btn" data-side="front">${ICON.camera}Schachtel fotografieren und erkennen</button>
        <div class="status" id="cover-status"></div>
      </div>` : ''}

      <div class="panel">
        <div class="field" style="margin:0"><label for="f-number">Inventarnummer (Aufkleber)</label>
          <div class="inline">
            <input id="f-number" inputmode="numeric" value="${draft.number === null || draft.number === undefined ? '' : esc(fmtNum(draft.number))}" placeholder="z. B. ${fmtNum(Math.max(0, maxNumber() + 1))}">
            <button class="btn small" id="num-scan" aria-label="Aufkleber scannen">${ICON.qr}</button>
          </div>
        </div>
        <div class="status" id="num-status"></div>
      </div>

      ${book ? `
        ${field('title', 'Titel')}
        ${field('author', 'Autor')}
        <div class="grid2">${field('year', 'Erscheinungsjahr', { attrs: 'inputmode="numeric"' })}${field('pages', 'Seiten', { attrs: 'inputmode="numeric"' })}</div>
        ${field('publisher', 'Verlag')}
        ${field('description', 'Inhalt', { type: 'textarea' })}
      ` : draft.category === 'spiel' ? `
        ${field('title', 'Titel')}
        ${field('publisher', 'Verlag')}
        <div class="grid2">${field('players', 'Spieler (z. B. 2–4)')}${field('age', 'Alter ab', { attrs: 'inputmode="numeric"' })}</div>
        ${field('duration', 'Spieldauer (Minuten)', { attrs: 'inputmode="numeric"' })}
        ${field('description', 'Beschreibung', { type: 'textarea' })}
      ` : `
        ${field('title', 'Bezeichnung')}
        <div class="grid2">${field('brand', 'Hersteller')}${field('model', 'Modell')}</div>
        ${field('serial', 'Seriennummer')}
        <div class="grid2">${field('purchaseDate', 'Kaufdatum', { type: 'date' })}${field('price', 'Kaufpreis (€)', { attrs: 'inputmode="decimal"' })}</div>
      `}
      ${field('notes', 'Notizen', { type: 'textarea' })}

      <div class="field"><label>${book ? 'Eigenes Foto (ersetzt das Cover)' : 'Foto'}</label>
        <div class="photo-row">
          ${coverHtml(draft, 'cover-lg')}
          <div class="btns">
            <button class="btn small" id="photo-take">Foto aufnehmen</button>
            ${draft.photo ? '<button class="btn small danger" id="photo-del">Foto entfernen</button>' : ''}
          </div>
        </div>
      </div>

      <div class="actions">
        <button class="btn primary" id="save">Speichern</button>
        ${isNew && book ? '<button class="btn" id="save-next">Speichern und nächstes Buch</button>' : ''}
      </div>
    </div>`;

  // Eingaben direkt in den Entwurf übernehmen
  document.querySelectorAll('[data-k]').forEach(el => el.addEventListener('input', () => { draft[el.dataset.k] = el.value; }));
  $('#f-category').addEventListener('change', e => { draft.category = e.target.value; renderForm(id, params); });
  $('#f-number').addEventListener('change', e => setNumber(e.target.value.trim() === '' ? null : e.target.value, false));

  $('#num-scan').addEventListener('click', () => scanSticker());
  document.querySelectorAll('.cover-btn[data-side]').forEach(b => b.addEventListener('click', () => {
    if (!window.PREVIEW && !aiKeyNow()) { const st = $('#cover-status'); st.className = 'status err'; st.textContent = 'Dafür brauchst du einen API-Schlüssel unter Einstellungen → KI-Suche.'; return; }
    coverSide = b.dataset.side;
    $('#cover-input').click();
  }));
  $('#photo-take').addEventListener('click', () => $('#photo-input').click());
  const del = $('#photo-del');
  if (del) del.addEventListener('click', () => { delete draft.photo; renderForm(id, params); });
  $('#save').addEventListener('click', () => submit(false));
  const sn = $('#save-next');
  if (sn) sn.addEventListener('click', () => {
    // Die Kamera muss direkt im Tipp geöffnet werden, gespeichert wird parallel
    const hasTitle = String(draft.title || '').trim() || draft.isbn;
    const clash = (draft.number !== null && draft.number !== undefined) && items.some(x => x.number === draft.number && x.id !== draft.id);
    const aiOk = window.PREVIEW || aiKeyNow();
    if (hasTitle && !clash && aiOk) {
      nextCover = { at: Date.now() };
      coverSide = 'back';
      $('#cover-input').click();
    }
    submit(true);
  });

  showNumberStatus();
  flushNextCover();
}

// Foto der nächsten Rückseite, das schon beim Speichern aufgenommen wurde
let nextCover = null;
function flushNextCover() {
  if (!nextCover || !nextCover.file || !draft || draft.createdAt < nextCover.at || !$('#cover-status')) return;
  const f = nextCover.file;
  nextCover = null;
  coverRecognize(f, 'back');
}

function showNumberStatus() {
  const el = $('#num-status');
  if (!el) return;
  el.className = 'status';
  if (draft.number === null || draft.number === undefined) { el.textContent = 'Noch keine Nummer vergeben.'; return; }
  const other = items.find(x => x.number === draft.number && x.id !== draft.id);
  if (other) { el.className = 'status err'; el.textContent = `Achtung: Diese Nummer gehört schon zu „${other.title || 'einem anderen Eintrag'}“.`; }
  else { el.className = 'status ok'; el.textContent = 'Nummer ist frei.'; }
}

function setNumber(val, fromScan) {
  if (val === null) { draft.number = null; showNumberStatus(); return; }
  const st = parseSticker(val);
  if (!st) { toast('Das ist keine gültige Nummer.'); return; }
  if (fromScan) learnDigits(st.raw);
  draft.number = st.num;
  const inp = $('#f-number');
  if (inp) inp.value = fmtNum(st.num);
  showNumberStatus();
}

function scanSticker() {
  openScanner('sticker', text => setNumber(text, true));
}

async function submit(next) {
  if (!String(draft.title || '').trim() && !draft.isbn) { toast('Gib mindestens einen Titel ein oder fotografiere das Cover.'); return; }
  const other = (draft.number !== null && draft.number !== undefined) ? items.find(x => x.number === draft.number && x.id !== draft.id) : null;
  if (other && !await askConfirm(`Nummer ${fmtNum(draft.number)} gehört schon zu „${other.title}“. Trotzdem speichern?`, 'Trotzdem speichern')) return;
  const it = { ...draft };
  delete it._for; delete it._auto; delete it._series;
  if (it.category === 'buch') { delete it.brand; delete it.model; delete it.serial; delete it.purchaseDate; delete it.price; }
  await saveItem(it);
  const savedId = it.id;
  draft = null;
  toast('Gespeichert.');
  if (next) location.hash = `#/new?cat=buch&series=1&t=${Date.now()}`;
  else location.hash = `#/item/${savedId}`;
}

// Foto aufnehmen und verkleinern
$('#photo-input').addEventListener('change', async e => {
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!file || !draft) return;
  try {
    const bmp = await createImageBitmap(file);
    const max = 900;
    const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas');
    c.width = Math.round(bmp.width * k);
    c.height = Math.round(bmp.height * k);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    draft.photo = c.toDataURL('image/jpeg', 0.8);
    const params = new URLSearchParams((location.hash.split('?')[1]) || '');
    const id = location.hash.startsWith('#/edit/') ? location.hash.split('/')[2].split('?')[0] : null;
    renderForm(id, params);
  } catch {
    toast('Das Foto konnte nicht gelesen werden.');
  }
});

/* ---------- Cover-Erkennung ---------- */
async function resizeImage(file, max = 1000) {
  const bmp = await createImageBitmap(file);
  const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas');
  c.width = Math.round(bmp.width * k);
  c.height = Math.round(bmp.height * k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.8);
}

let coverSide = 'front';

function coverPrompt(cat, side) {
  if (cat !== 'spiel' && side === 'back') return `Das Foto zeigt die Rückseite eines Buches, oft ein deutsches Kinder- oder Fachbuch. Lies die sichtbaren Angaben ab. Erfinde nichts: Was nicht erkennbar ist, bleibt leer.
- beschreibung: Gib den Klappentext bzw. die Inhaltsbeschreibung wieder, möglichst wörtlich, bei langen Texten auf höchstens 5 Sätze gekürzt. Lass Werbung, Pressestimmen, Preise und Altersangaben weg.
- isbn: die ISBN, meist über oder unter dem Strichcode (beginnt mit 978 oder 979), ohne Bindestriche.
- titel, autor, verlag, jahr: nur wenn sie auf der Rückseite stehen.
- inventarnummer: Auf der Rückseite klebt meist ein eigener Inventaraufkleber (ein aufgeklebtes Etikett mit QR-Code und einer aufgedruckten Nummer, oft mit führenden Nullen wie 0042). Gib genau diese Nummer an, so wie sie aufgedruckt ist, mit führenden Nullen. Nicht die ISBN, nicht die Ziffern unter dem Strichcode, keinen Preis und keine Bibliotheks- oder Verlagsnummer. Ist kein solcher Aufkleber zu sehen oder die Nummer nicht sicher lesbar, bleibt das Feld leer.
Antworte nur mit JSON, ohne weiteren Text:
{"titel":"","autor":"","verlag":"","jahr":"","beschreibung":"","isbn":"","inventarnummer":""}`;
  if (cat === 'spiel') return `Das Foto zeigt die Schachtel eines Gesellschaftsspiels. Lies die sichtbaren Angaben ab. Erfinde nichts: Was nicht erkennbar ist, bleibt leer. Eine kurze Beschreibung (höchstens 2 Sätze) nur, wenn sie auf der Schachtel steht oder du das Spiel sicher kennst.
Antworte nur mit JSON, ohne weiteren Text:
{"titel":"","verlag":"","spieler":"z. B. 2–4","alter":"nur Zahl","dauer":"Minuten als Zahl","beschreibung":""}`;
  return `Das Foto zeigt das Cover (Vorder- oder Rückseite) eines Buches, oft ein deutsches Kinder- oder Fachbuch. Lies die sichtbaren Angaben ab. Erfinde nichts: Was nicht erkennbar ist, bleibt leer. Bei mehreren Namen: Autor(en) zuerst, Illustrator nur, wenn kein Autor erkennbar ist. Eine kurze Inhaltsangabe (höchstens 3 Sätze) nur, wenn ein Klappentext lesbar ist oder du genau dieses Buch sicher kennst. Steht eine ISBN auf dem Foto, gib sie ohne Bindestriche an.
Antworte nur mit JSON, ohne weiteren Text:
{"titel":"","autor":"","verlag":"","jahr":"","beschreibung":"","isbn":""}`;
}

async function coverRecognize(file, side) {
  const status = $('#cover-status');
  const setStatus = (cls, txt) => { const el = $('#cover-status'); if (el) { el.className = 'status ' + cls; el.textContent = txt; } };
  let img;
  try { img = await resizeImage(file, 1000); } catch { setStatus('err', 'Das Foto konnte nicht gelesen werden.'); return; }
  const back = side === 'back' && draft.category !== 'spiel';
  if (!back) draft.photo = img;   // Nur die Vorderseite wird zum Cover
  if (window.PREVIEW) { rerenderForm(); setStatus('err', AI_ERRORS.preview); return; }
  if (status) { status.className = 'status'; status.textContent = back ? 'Lese die Rückseite …' : 'Lese das Cover …'; }
  document.querySelectorAll('.cover-btn').forEach(b => { b.disabled = true; });
  try {
    const r = await aiComplete(coverPrompt(draft.category, back ? 'back' : 'front'), img);
    const map = draft.category === 'spiel'
      ? { titel: 'title', verlag: 'publisher', spieler: 'players', alter: 'age', dauer: 'duration', beschreibung: 'description' }
      : { titel: 'title', autor: 'author', verlag: 'publisher', jahr: 'year', beschreibung: 'description' };
    let n = 0;
    for (const [from, to] of Object.entries(map)) {
      const v = r && r[from] != null ? String(r[from]).trim() : '';
      if (v && !String(draft[to] || '').trim()) { draft[to] = v; n++; }
    }
    let isbnNew = false;
    if (draft.category === 'buch' && r && r.isbn && !draft.isbn) {
      const c = cleanIsbn(r.isbn);
      if (validIsbn(c)) { draft.isbn = toIsbn13(c); isbnNew = true; n++; }
    }
    let numNew = false;
    if (back && r && r.inventarnummer != null && (draft.number === null || draft.number === undefined)) {
      const raw = String(r.inventarnummer).replace(/\D/g, '');
      if (raw && raw.length <= 8) { learnDigits(raw); draft.number = parseInt(raw, 10); numNew = true; n++; }
    }
    rerenderForm();
    const hint = back
      ? (draft.photo ? '' : ' Für das Cover fotografierst du noch die Vorderseite.')
      : (draft.description && draft.number != null ? '' : ' Für Inhalt und Inventarnummer fotografierst du noch die Rückseite.');
    const numInfo = back && draft.category === 'buch' && !numNew && (draft.number === null || draft.number === undefined) ? ' Den Inventaraufkleber habe ich nicht erkannt, trag die Nummer bitte von Hand ein.' : '';
    setStatus(n ? 'ok' : 'err', n
      ? `${back ? 'Von der Rückseite' : 'Vom Cover'} übernommen${numNew ? `, inklusive Inventarnummer ${fmtNum(draft.number)}` : ''}. Bitte kurz prüfen.${numInfo}${hint}`
      : 'Auf dem Foto war nichts Lesbares. Versuch es noch einmal ohne Spiegelung.');
  } catch (e) {
    rerenderForm();
    setStatus('err', AI_ERRORS[e && e.code] || 'Die Erkennung hat nicht geklappt. Versuch es noch einmal.');
  }
}

function rerenderForm() {
  const params = new URLSearchParams((location.hash.split('?')[1]) || '');
  const id = location.hash.startsWith('#/edit/') ? location.hash.split('/')[2].split('?')[0] : null;
  renderForm(id, params);
}

$('#cover-input').addEventListener('change', e => {
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if (nextCover) {
    if (file) { nextCover.file = file; flushNextCover(); } else nextCover = null;
    return;
  }
  if (file && draft) coverRecognize(file, coverSide);
});

/* ---------- PDF-Steckbrief ---------- */
const PDF_C = {
  paper: '#F6F8EC', green: '#19555F', lime: '#C5D62E', orange: '#E8893A', turq: '#80C4C8', olive: '#6E7D1B',
  sticker: '#F4D35E', ink: '#1B2B2E', muted: '#5A6B66', line: '#DDE3CC', peach: '#FCE9D4', soft: '#DDEEEF', limeSoft: '#EEF3C4',
};

let jsPdfP = null;
function loadJsPdf() {
  if (window.jspdf) return Promise.resolve(window.jspdf);
  if (!jsPdfP) jsPdfP = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
    s.onload = () => (window.jspdf ? res(window.jspdf) : rej(new Error('jspdf')));
    s.onerror = () => { jsPdfP = null; rej(new Error('jspdf')); };
    document.head.appendChild(s);
  });
  return jsPdfP;
}

function pdfLoadImg(src) {
  return new Promise((res, rej) => {
    const i = new Image();
    if (!src.startsWith('data:')) { i.crossOrigin = 'anonymous'; i.referrerPolicy = 'no-referrer'; }
    i.onload = () => res(i);
    i.onerror = rej;
    i.src = src;
  });
}

async function svgToPng(svg, w, h, scale = 6) {
  const img = await pdfLoadImg('data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg));
  const c = document.createElement('canvas');
  c.width = Math.round(w * scale); c.height = Math.round(h * scale);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/png');
}

// Cover zuschneiden, mit runden Ecken auf weißem Grund
async function pdfCover(it, wmm, hmm) {
  const chain = [it.photo, it.cover, ...String(it.coverAlt || '').split('|')].filter(Boolean);
  for (const src of chain) {
    try {
      const img = await pdfLoadImg(src);
      if (img.naturalWidth < 40 || img.naturalHeight < 40) continue;
      const k = 12;
      const c = document.createElement('canvas');
      c.width = Math.round(wmm * k); c.height = Math.round(hmm * k);
      const x = c.getContext('2d');
      x.fillStyle = '#FFFFFF'; x.fillRect(0, 0, c.width, c.height);
      const r = 3 * k, W = c.width, H = c.height;
      x.beginPath();
      x.moveTo(r, 0); x.lineTo(W - r, 0); x.quadraticCurveTo(W, 0, W, r); x.lineTo(W, H - r); x.quadraticCurveTo(W, H, W - r, H);
      x.lineTo(r, H); x.quadraticCurveTo(0, H, 0, H - r); x.lineTo(0, r); x.quadraticCurveTo(0, 0, r, 0); x.closePath();
      x.clip();
      const s = Math.max(W / img.naturalWidth, H / img.naturalHeight);
      const dw = img.naturalWidth * s, dh = img.naturalHeight * s;
      x.drawImage(img, (W - dw) / 2, (H - dh) / 2, dw, dh);
      return c.toDataURL('image/jpeg', 0.9);
    } catch { /* nächstes Bild versuchen */ }
  }
  return null;
}

// Nur Zeichen, die die PDF-Standardschrift kennt
function pdfText(s) {
  return String(s || '').normalize('NFC')
    .replace(/[\u2010-\u2012\u2212]/g, '-').replace(/\u00A0/g, ' ')
    .replace(/[^\x09\x0A\x0D\x20-\x7E\xA0-\xFF\u20AC\u201A\u201E\u2026\u2018\u2019\u201C\u201D\u2022\u2013\u2014\u0152\u0153\u0160\u0161\u0178\u017D\u017E]/g, '')
    .trim();
}

function pdfFacts(it) {
  if (it.category === 'buch') return [['Verlag', it.publisher], ['Erschienen', it.year], ['Seiten', it.pages], ['ISBN', it.isbn]];
